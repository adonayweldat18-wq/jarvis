<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>J.A.R.V.I.S.</title>
<style>
:root{--terra:#b85a3e;--red:#d6402f;--ink:#2a1f2d;--dim:#8a7d92;--card:rgba(255,255,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#d9cdea 0%,#e9dcec 50%,#f3e3e6 100%);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:17px;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);overflow:hidden}
button{font:inherit;cursor:pointer}
header{padding:16px 18px 0;flex:none;display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
#status{color:var(--dim);font-size:15px;margin-top:4px}
#conn{color:var(--dim);font-size:14px;font-weight:600;align-self:center;margin-right:2px}
.hb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.4);color:var(--dim);display:grid;place-items:center;padding:0;flex:none;align-self:center}
.hb.red{color:var(--red);background:transparent}
.hb.on{background:var(--red);color:#fff}
h2{margin:0 0 10px;font-size:19px}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding:0 16px}
.view.on{display:flex}
.scroll{overflow:auto;padding-top:14px}
.orb{width:150px;height:150px;border-radius:50%;margin:26px auto 18px;flex:none;background:radial-gradient(circle at 38% 28%,#cb7658,var(--terra) 58%,#9d4630);box-shadow:0 20px 44px rgba(184,90,62,.28),inset 0 -10px 24px rgba(0,0,0,.14);animation:breathe 4s ease-in-out infinite}
body.listening .orb{animation-duration:1.1s;box-shadow:0 0 0 14px rgba(184,90,62,.16),0 20px 50px rgba(184,90,62,.45),inset 0 -10px 24px rgba(0,0,0,.14)}
body.speaking .orb{animation-duration:.6s}
body.looking .orb{animation-duration:2s}
@keyframes breathe{50%{transform:scale(1.07)}}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.msg{max-width:82%;padding:11px 15px;border-radius:18px;line-height:1.35;white-space:pre-wrap;font-size:16px}
.me{align-self:flex-end;background:var(--terra);color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.sys{align-self:center;color:var(--dim);font-size:14px}
.card{align-self:stretch;max-width:100%;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.card b{color:var(--terra)}
#callRow{display:flex;gap:12px;justify-content:center;align-items:center;padding:6px 0 14px;flex:none}
.pill{border:0;border-radius:999px;background:rgba(214,64,47,.13);color:var(--red);font-weight:700;font-size:16px;padding:15px 24px}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--red);background:transparent;color:var(--red);display:grid;place-items:center;flex:none;padding:0;font-size:22px}
.round.fill,.round.on{background:var(--red);color:#fff}
#chatForm{display:flex;gap:8px;align-items:center;padding:6px 0 14px;flex:none}
#chatForm .round{width:46px;height:46px}
input,select{width:100%;font:inherit;font-size:16px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.85);border-radius:14px;padding:12px 14px;color:var(--ink);min-width:0}
#chatForm input{border-radius:24px}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
ul{list-style:none;margin:0 0 10px;padding:0}
li{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07);display:flex;justify-content:space-between;gap:8px}
li button{background:none;border:0;color:var(--dim);font-size:22px}
li.done span{text-decoration:line-through;color:var(--dim)}
.row{display:flex;gap:8px}
.row .round{width:46px;height:46px}
label{display:block;color:var(--dim);font-size:15px;margin:12px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;color:var(--ink)}
label.chk input{width:auto}
nav{display:flex;justify-content:space-around;flex:none;margin:0 16px calc(10px + env(safe-area-inset-bottom,0px));padding:7px;border-radius:28px;background:rgba(255,255,255,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 6px 24px rgba(80,50,90,.08)}
nav button{flex:1;max-width:76px;height:46px;background:none;border:0;color:var(--dim);border-radius:23px;display:grid;place-items:center;padding:0}
nav button.on{color:var(--red);background:rgba(214,64,47,.14)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cam{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
#cam.on{display:flex}
#camV{flex:1;min-height:0;width:100%;object-fit:cover}
#camHint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6);padding:0 24px}
#camBar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
#camBar .hb{width:48px;height:48px;background:rgba(255,255,255,.22);color:#fff}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);padding:0}
#shutter:active{background:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>Jarvis</h1><div id="status">bereit</div></div>
  <span id="conn">verbunden</span>
  <button class="hb" id="reset" aria-label="Unterhaltung zurücksetzen"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
  <button class="hb" id="camBtn" aria-label="Kamera öffnen"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="hb red" id="convoBtn" aria-label="Gesprächsmodus an/aus"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</header>

<section class="view on" id="v-talk">
  <div class="orb" aria-hidden="true"></div>
  <div id="talkHost" style="flex:1;min-height:0;display:flex;flex-direction:column"><div id="log" aria-live="polite"></div></div>
  <div id="callRow">
    <button class="pill" id="hangup">Auflegen</button>
    <button class="round" id="mic" aria-label="Sprechen"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
</section>

<section class="view" id="v-chat">
  <div id="chatHost" style="flex:1;min-height:0;display:flex;flex-direction:column;padding-top:14px"></div>
  <form id="chatForm">
    <input id="chatIn" placeholder="Schreibe mit JARVIS" autocomplete="off">
    <button class="round fill" aria-label="Senden">&#8593;</button>
  </form>
</section>

<section class="view scroll" id="v-tasks">
  <div class="panel"><h2>Aufgaben</h2><ul id="tasks"></ul>
    <form id="taskForm" class="row"><input id="taskIn" placeholder="Neue Aufgabe" autocomplete="off"><button class="round fill" aria-label="Hinzufügen">+</button></form>
  </div>
</section>

<section class="view scroll" id="v-set">
  <div class="panel"><h2>Gedächtnis</h2><ul id="mem"></ul><div style="color:var(--dim);font-size:15px">Sag: &quot;Merk dir, dass ...&quot;</div></div>
  <div class="panel"><h2>Einstellungen</h2>
    <label for="okey">OpenAI API-Key</label>
    <input id="okey" type="password" placeholder="sk-..." autocomplete="off">
    <label for="omodel">Modell</label>
    <input id="omodel" value="gpt-4o-mini">
    <label for="ovoice">Stimme</label>
    <select id="ovoice"><option>coral</option><option>nova</option><option>onyx</option><option>alloy</option><option>shimmer</option><option>sage</option></select>
    <label class="chk"><input type="checkbox" id="voice" checked> Sprachausgabe</label>
  </div>
</section>

<nav>
  <button class="on" data-v="v-talk" aria-label="Sprechen"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></button>
  <button data-v="v-chat" aria-label="Chat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
  <button data-v="v-tasks" aria-label="Aufgaben"><svg class="i" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.4 1.4L7 5M3.5 12l1.4 1.4L7 11M3.5 18l1.4 1.4L7 17"/></svg></button>
  <button data-v="v-set" aria-label="Einstellungen"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</nav>

<div id="cam" role="dialog" aria-label="Kamera">
  <video id="camV" playsinline muted autoplay></video>
  <div id="camHint">Tippe auf den Auslöser oder stelle deine Frage per Sprache.</div>
  <div id="camBar">
    <button class="hb" id="camClose" aria-label="Kamera schließen"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="shutter" aria-label="Foto aufnehmen"></button>
    <button class="hb" id="camFlip" aria-label="Kamera wechseln"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 0-14-5.3M4 4v4h4M4 12a8 8 0 0 0 14 5.3M20 20v-4h-4"/></svg></button>
  </div>
</div>

<script>
/* ===== Speicher (localStorage = Daten bleiben im Browser) ===== */
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let tasks=load('j_tasks',[]), memory=load('j_mem',[]), history=[];
const $=id=>document.getElementById(id);
$('okey').value=load('j_okey',''); $('omodel').value=load('j_omodel','gpt-4o-mini');
$('ovoice').value=load('j_ovoice','coral'); $('voice').checked=load('j_voice',true);
['okey','omodel','ovoice'].forEach(i=>$(i).onchange=()=>{save('j_'+i,$(i).value.trim());conn()});
$('voice').onchange=()=>{save('j_voice',$('voice').checked);stopSpeech()};
function conn(){const k=$('okey').value.trim();$('conn').textContent=!navigator.onLine?'offline':k?'verbunden':'kein Key'}
addEventListener('online',conn);addEventListener('offline',conn);conn();

/* ===== Anzeige ===== */
function say(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('log').append(d);$('log').scrollTop=1e9}
function renderList(id,items,onDel,onTog){
  const ul=$(id);ul.replaceChildren();
  items.forEach((it,i)=>{
    const li=document.createElement('li');if(it.done)li.className='done';
    const s=document.createElement('span');s.textContent=it.text;if(onTog){s.style.cursor='pointer';s.onclick=()=>onTog(i)}
    const b=document.createElement('button');b.textContent='×';b.title='Löschen';b.onclick=()=>onDel(i);
    li.append(s,b);ul.append(li);
  });
}
function render(){
  renderList('tasks',tasks,i=>{tasks.splice(i,1);save('j_tasks',tasks);render()},i=>{tasks[i].done=!tasks[i].done;save('j_tasks',tasks);render()});
  renderList('mem',memory,i=>{memory.splice(i,1);save('j_mem',memory);render()});
}

/* ===== Stimme (OpenAI-Stimme, sonst iPhone-Stimme) ===== */
const player=new Audio();
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
document.addEventListener('pointerdown',()=>{if(!player.dataset.ok){player.dataset.ok=1;player.src=SILENT;player.play().catch(()=>{})}},{once:true});
let spkId=0,speakingNow=false,busy=false,convo=false;
function bestVoice(){
  const de=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').startsWith('de'));
  const score=v=>{const n=v.name.toLowerCase();let p=0;
    if(n.includes('premium'))p+=30;if(n.includes('enhanced')||n.includes('erweitert'))p+=20;
    if(/anna|markus|petra|viktor|yannick/.test(n))p+=5;if(v.localService)p+=1;return p};
  return de.sort((a,b)=>score(b)-score(a))[0];
}
function speechEnded(id){if(id!==spkId)return;speakingNow=false;document.body.classList.remove('speaking');afterSpeak()}
function browserSpeak(text,id){
  if(!('speechSynthesis' in window)){speechEnded(id);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';
  const v=bestVoice();if(v)u.voice=v;
  u.onstart=()=>document.body.classList.add('speaking');
  u.onend=u.onerror=()=>speechEnded(id);
  speechSynthesis.speak(u);
}
function stopSpeech(){spkId++;speakingNow=false;document.body.classList.remove('speaking');try{speechSynthesis.cancel()}catch{}player.pause()}
async function speak(text){
  if(!$('voice').checked)return;
  const id=++spkId;speakingNow=true;
  const clean=text.replace(/[*#_`]/g,'').slice(0,1500);
  const key=$('okey').value.trim();
  if(key){
    try{
      const r=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model:'gpt-4o-mini-tts',voice:$('ovoice').value,input:clean,
          instructions:'Sprich Deutsch, natürlich, ruhig und freundlich, wie ein kluger persönlicher Assistent.',response_format:'mp3'})});
      if(!r.ok)throw new Error(r.status);
      const url=URL.createObjectURL(await r.blob());
      if(id!==spkId)return;
      speechSynthesis.cancel();player.pause();player.src=url;
      player.onplay=()=>document.body.classList.add('speaking');
      player.onended=()=>speechEnded(id);
      await player.play();return;
    }catch(e){if(id!==spkId)return}
  }
  browserSpeak(clean,id);
}

/* ===== Spracherkennung + Gesprächsmodus ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function syncUI(){$('convoBtn').classList.toggle('on',convo);$('mic').classList.toggle('on',!!rec)}
function startListen(){
  if(!SR){say('Spracherkennung wird in diesem Browser nicht unterstützt. Nutze Safari, Chrome oder Edge.','sys');convo=false;syncUI();return}
  if(rec)return;
  stopSpeech();
  let got=false;rec=new SR();rec.lang='de-DE';rec.interimResults=false;
  rec.onstart=()=>{document.body.classList.add('listening');syncUI()};
  rec.onresult=e=>{got=true;handle(e.results[0][0].transcript)};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){convo=false;say('Mikrofon-Zugriff verweigert. Erlaube ihn in den Browser-Einstellungen.','sys')}
    else if(e.error!=='no-speech'&&e.error!=='aborted')say('Mikrofon-Fehler: '+e.error,'sys')};
  rec.onend=()=>{document.body.classList.remove('listening');rec=null;syncUI();if(!got)afterSpeak()};
  try{rec.start()}catch{rec=null}
}
function afterSpeak(){
  if(!convo)return;
  setTimeout(()=>{if(convo&&!rec&&!busy&&!speakingNow)startListen()},450);
}
$('mic').onclick=()=>{if(rec)rec.stop();else startListen()};
$('convoBtn').onclick=()=>{convo=!convo;syncUI();if(convo)startListen();else if(rec)rec.abort()};
$('hangup').onclick=()=>{convo=false;stopSpeech();if(rec)rec.abort();closeCam();syncUI()};
$('reset').onclick=()=>{history=[];$('log').replaceChildren();stopSpeech();say('Unterhaltung zurückgesetzt.','sys')};

/* ===== Erinnerungen ===== */
function remind(ms,text){
  setTimeout(()=>{const m='Erinnerung: '+text;say(m,'ai');speak(m);
    try{if(Notification.permission==='granted')new Notification('JARVIS',{body:text})}catch{}},ms);
}

/* ===== Kamera ===== */
let camStream=null,camFacing='environment';
async function openCam(){
  $('cam').classList.add('on');document.body.classList.add('looking');
  try{
    closeStream();
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing,width:{ideal:1280}},audio:false});
    $('camV').srcObject=camStream;await $('camV').play().catch(()=>{});
    return true;
  }catch(e){
    closeCam();
    say(e&&e.name==='NotAllowedError'?'Kamera-Zugriff verweigert. Erlaube ihn in den Browser-Einstellungen.':'Kamera nicht verfügbar. Sie funktioniert nur über https und mit einer Kamera.','sys');
    return false;
  }
}
function closeStream(){if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;$('camV').srcObject=null}
function closeCam(){closeStream();$('cam').classList.remove('on');document.body.classList.remove('looking')}
function snap(){
  const v=$('camV');if(!v.videoWidth)return null;
  const s=Math.min(1,1024/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.8);
}
async function shoot(question){
  const url=snap();closeCam();
  if(!url)return reply('Ich konnte kein Bild aufnehmen.');
  addCard('Foto','',url);
  await askAI(question||'Was siehst du auf diesem Foto?',url);
}
async function lookAt(question){
  if(!await openCam())return;
  await new Promise(r=>setTimeout(r,1300));
  await shoot(question);
}
async function run(fn){busy=true;try{await fn()}finally{busy=false;if(!speakingNow)afterSpeak()}}
$('camBtn').onclick=()=>openCam();
$('camClose').onclick=closeCam;
$('shutter').onclick=()=>run(()=>shoot(''));
$('camFlip').onclick=()=>{camFacing=camFacing==='environment'?'user':'environment';openCam()};

/* ===== Befehle erkennen, sonst KI fragen ===== */
function reply(t){say(t,'ai');speak(t)}
const handle=input=>run(()=>route(input));
async function route(input){
  const text=input.trim();if(!text)return;
  say(text,'me');let m;
  if(camStream)return shoot(text);
  if(m=text.match(/^merk(?:e)? dir,? (?:dass )?(.+)/i)){memory.push({text:m[1]});save('j_mem',memory);render();return reply('Gemerkt: '+m[1])}
  if(/^(vergiss alles|lösche (das )?gedächtnis)/i.test(text)){memory=[];save('j_mem',memory);render();return reply('Gedächtnis gelöscht.')}
  if(/was weißt du (alles )?über mich/i.test(text))return reply(memory.length?'Das weiß ich: '+memory.map(x=>x.text).join('; '):'Ich weiß noch nichts über dich. Sag "Merk dir ...".');
  if(m=text.match(/^(?:neue )?aufgabe:? (.+)/i)){tasks.push({text:m[1],done:false});save('j_tasks',tasks);render();return reply('Aufgabe hinzugefügt: '+m[1])}
  if(/^(welche|zeige?|liste) .*aufgaben/i.test(text)){const o=tasks.filter(t=>!t.done);return reply(o.length?'Offen: '+o.map(t=>t.text).join(', '):'Keine offenen Aufgaben.')}
  if(m=text.match(/^erinnere mich in (\d+) (sekunden?|minuten?|stunden?) (?:an |daran,? )?(.+)/i)){
    const n=+m[1],u=m[2][0].toLowerCase(),ms=n*(u==='s'?1e3:u==='m'?6e4:36e5);
    try{Notification.requestPermission()}catch{}
    remind(ms,m[3]);return reply(`In Ordnung. Ich erinnere dich in ${n} ${m[2]} an ${m[3]}. Lass diesen Tab offen.`)}
  if(/wie spät|uhrzeit/i.test(text))return reply('Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.');
  if(/was siehst du|schau (mal )?(hier )?(hin|her|das an)|guck (mal )?(hier )?(hin|her)|was ist das (hier|da)|kannst du (das|mich) sehen|nimm (ein )?(foto|bild) auf/i.test(text))return lookAt(text);
  if(m=text.match(/(?:zeig|zeige|zeigst)(?: mir)?(?: ein| eine| mal)* (?:bilder|bild|fotos|foto)(?: von| vom| der| des| über)? (.+)/i))return showImage(m[1]);
  if(m=text.match(/^wie sieht (?:ein |eine |der |die |das )?(.+) aus/i))return showImage(m[1]);
  if(/was (läuft|ist los|passiert).*welt|nachrichten|schlagzeilen|aktuelle news/i.test(text))return showNews();
  await askAI(text);
}

/* ===== Bilder & Nachrichten ===== */
function addCard(title,text,url){
  const d=document.createElement('div');d.className='msg ai card';
  if(url){const i=document.createElement('img');i.src=url;i.alt=title;d.append(i)}
  const b=document.createElement('b');b.textContent=title;d.append(b);
  if(text){const p=document.createElement('div');p.textContent=text;d.append(p)}
  $('log').append(d);$('log').scrollTop=1e9;
}
async function wikiImages(term,max){
  for(const lang of ['de','en']){
    try{
      const u='https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(term)+'&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=700';
      const d=await (await fetch(u)).json();
      const pages=Object.values(d.query?.pages||{}).sort((a,b)=>a.index-b.index).filter(p=>p.thumbnail);
      if(pages.length)return pages.slice(0,max).map(p=>({title:p.title,url:p.thumbnail.source}));
    }catch(e){}
  }
  return [];
}
async function showImage(term){
  say('…','sys');const w=$('log').lastChild;
  const r=await wikiImages(term,2);w.remove();
  if(!r.length)return reply('Ich habe kein Bild zu "'+term+'" gefunden.');
  r.forEach(x=>addCard(x.title,'',x.url));speak('Hier ist ein Bild zu '+term+'.');
}
async function showNews(){
  const key=$('okey').value.trim();
  if(!key)return reply('Für Nachrichten brauche ich den OpenAI API-Key.');
  say('Ich suche die aktuellen Nachrichten …','sys');const w=$('log').lastChild;
  const prompt='Suche im Internet die wichtigsten aktuellen Weltnachrichten von heute ('+new Date().toLocaleDateString('de-DE')+'). Antworte NUR mit einem JSON-Array aus genau 4 Objekten, ohne weiteren Text, im Format {"titel":"kurze deutsche Schlagzeile","text":"ein Satz auf Deutsch","bild":"kurzer Wikipedia-Suchbegriff für ein passendes Foto, z.B. Land, Stadt oder Person"}.';
  let data=null,err='';
  for(const tool of ['web_search','web_search_preview']){
    try{
      const r=await fetch('https://api.openai.com/v1/responses',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model:$('omodel').value.trim(),tools:[{type:tool}],input:prompt})});
      const d=await r.json();
      if(r.ok){data=d;break}
      err=d.error?.message||String(r.status);
    }catch(e){err='Verbindung fehlgeschlagen'}
  }
  w.remove();
  if(!data)return reply('Die Nachrichtensuche hat nicht geklappt: '+err);
  const txt=(data.output||[]).filter(o=>o.type==='message').flatMap(o=>o.content||[]).map(c=>c.text||'').join('');
  let items;try{items=JSON.parse(txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1))}catch{}
  if(!items||!items.length)return reply(txt||'Ich habe keine Nachrichten gefunden.');
  items=items.slice(0,4);
  const imgs=await Promise.all(items.map(it=>wikiImages(it.bild||it.titel,1)));
  items.forEach((it,i)=>addCard(it.titel,it.text,imgs[i][0]?.url));
  speak('Das sind die Schlagzeilen: '+items.map(i=>i.titel).join('. '));
}

/* ===== KI-Chat (OpenAI, mit Bild-Unterstützung) ===== */
async function askAI(text,imageUrl){
  const key=$('okey').value.trim();
  if(!key)return reply('Ich brauche deinen OpenAI API-Key. Trage ihn unter Einstellungen ein.');
  history.push({role:'user',content:imageUrl?'[Foto gesendet] '+text:text});history=history.slice(-20);
  const sys='Du bist JARVIS, der persönliche KI-Assistent des Nutzers, inspiriert vom Assistenten aus Iron Man. Antworte auf Deutsch, höflich, präzise, mit trockenem Humor und knapp (meist 1-3 Sätze), weil deine Antworten vorgelesen werden. Wenn der Nutzer ein Foto der Kamera schickt, beschreibe oder beantworte genau das, was darauf zu sehen ist. Heute ist '+new Date().toLocaleString('de-DE')+'. Das weißt du über den Nutzer: '+(memory.map(x=>x.text).join('; ')||'noch nichts')+'.';
  const msgs=[{role:'system',content:sys},...history];
  if(imageUrl)msgs[msgs.length-1]={role:'user',content:[{type:'text',text},{type:'image_url',image_url:{url:imageUrl}}]};
  say('…','sys');const wait=$('log').lastChild;
  try{
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:$('omodel').value.trim(),messages:msgs})});
    const d=await r.json();wait.remove();
    if(!r.ok)return reply('Fehler von OpenAI: '+(d.error?.message||r.status));
    const out=d.choices?.[0]?.message?.content?.trim()||'Keine Antwort erhalten.';
    history.push({role:'assistant',content:out});reply(out);
  }catch(e){wait.remove();reply('Verbindung fehlgeschlagen. Bist du online?')}
}

$('taskForm').onsubmit=e=>{e.preventDefault();const v=$('taskIn').value.trim();if(!v)return;tasks.push({text:v,done:false});save('j_tasks',tasks);$('taskIn').value='';render()};
try{speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices()}}catch{}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{

});

render();
reply('Systeme online. Wie kann ich helfen?');
