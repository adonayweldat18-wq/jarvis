<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #0d0709;
    --panel: rgba(30, 10, 14, 0.85);
    --line: rgba(255, 60, 50, 0.12);
    --red: #ff3b2f;
    --red-soft: rgba(255, 59, 47, 0.35);
    --text: #f3e6e4;
    --muted: #b98f8a;
    --lvl: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255, 40, 30, 0.18), transparent 60%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
  }
  .logo { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.4em; color: var(--red); font-weight: 700; }
  .top { display: flex; align-items: center; gap: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--red-soft); background: transparent; color: var(--red);
    font-size: 18px; cursor: pointer;
  }
  .iconbtn:hover { background: rgba(255, 59, 47, 0.1); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; min-height: 0; padding: 0 16px; }

  /* Orb */
  .orb { position: relative; width: 170px; height: 170px; margin: 10px 0 6px; flex-shrink: 0; }
  .orb .core {
    position: absolute; inset: 50px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffd2c8 25%, var(--red) 60%, transparent 72%);
    box-shadow: 0 0 40px var(--red), 0 0 90px var(--red-soft);
    transform: scale(calc(0.9 + var(--lvl) * 0.5));
    transition: transform 0.08s linear;
  }
  .orb .ring { position: absolute; border-radius: 50%; border: 2px solid var(--red-soft); }
  .orb .r1 { inset: 30px; border-color: rgba(255, 59, 47, 0.7); border-right-color: transparent; }
  .orb .r2 { inset: 8px; border-style: dashed; }
  body[data-state="idle"] .core { animation: breathe 3s ease-in-out infinite; }
  body[data-state="thinking"] .r1 { animation: spin 0.8s linear infinite; }
  body[data-state="thinking"] .r2 { animation: spin 3s linear infinite reverse; }
  body[data-state="speaking"] .core { animation: talk 0.35s ease-in-out infinite alternate; }
  body[data-state="listening"] .r2 { border-color: var(--red); animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { opacity: 0.75; } }
  @keyframes talk { to { transform: scale(1.12); } }

  #status { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 10px; text-align: center; }
  #status.err { color: #ff8a80; }

  #chat {
    width: 100%; max-width: 760px; flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 12px;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
    border: 1px solid var(--red-soft); background: var(--panel); white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; border-color: var(--red); }
  .msg.jarvis { align-self: flex-start; }
  .msg.jarvis:empty::after { content: "…"; color: var(--muted); }

  footer { padding: 10px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .controls { display: flex; gap: 12px; align-items: center; }
  .btn {
    border: 1px solid var(--red); background: rgba(255, 59, 47, 0.12); color: var(--text);
    padding: 11px 22px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: rgba(255, 59, 47, 0.25); }
  .btn.live { background: var(--red); color: #fff; box-shadow: 0 0 20px var(--red-soft); }
  #micBtn { width: 52px; height: 52px; font-size: 22px; padding: 0; }
  body[data-state="listening"] #micBtn { background: var(--red); box-shadow: 0 0 24px var(--red); }

  #textForm { display: flex; gap: 8px; width: 100%; max-width: 760px; }
  #textInput {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 999px;
    border: 1px solid var(--red-soft); background: var(--panel); color: var(--text); font-size: 15px;
  }
  #textInput:focus { outline: none; border-color: var(--red); }

  /* Einstellungen */
  dialog {
    width: min(460px, calc(100% - 32px)); border: 1px solid var(--red); border-radius: 16px;
    background: #170a0d; color: var(--text); padding: 20px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; color: var(--red); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  dialog input[type=password], dialog input[type=text], dialog select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--red-soft);
    background: #0d0709; color: var(--text); font-size: 14px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > :first-child { flex: 1; }
  .small { padding: 8px 12px; font-size: 13px; }
  .meter { height: 8px; border-radius: 4px; background: #2a1216; margin-top: 8px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--red); transition: width 0.06s; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--text); }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }

  @media (max-width: 480px) {
    .orb { width: 130px; height: 130px; }
    .orb .core { inset: 38px; }
    .orb .r1 { inset: 22px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body data-state="idle">

<header>
  <div class="logo">J.A.R.V.I.S.</div>
  <div class="top">
    <span id="conn">BEREIT</span>
    <button class="iconbtn" id="settingsBtn" title="Einstellungen">⚙</button>
  </div>
</header>

<main>
  <div class="orb"><div class="ring r2"></div><div class="ring r1"></div><div class="core"></div></div>
  <div id="status">Bereit</div>
  <div id="chat"></div>
</main>

<footer>
  <div class="controls">
    <button class="btn" id="callBtn">Gespräch starten</button>
    <button class="btn" id="micBtn" title="Einmal sprechen (Leertaste)">🎤</button>
  </div>
  <form id="textForm" autocomplete="off">
    <input id="textInput" placeholder="Oder schreib etwas …">
    <button class="btn small" type="submit">Senden</button>
  </form>
</footer>

<dialog id="settings">
  <h2>Einstellungen</h2>

  <label for="keyInput">OpenAI API-Key</label>
  <div class="row">
    <input type="password" id="keyInput" placeholder="sk-proj-…" autocomplete="off">
    <button class="btn small" type="button" id="showKey">👁</button>
  </div>
  <div class="hint">Wird nur hier in deinem Browser gespeichert, nicht auf GitHub.</div>

  <label for="micSelect">Mikrofon</label>
  <div class="row">
    <select id="micSelect"><option value="">Standard-Mikrofon</option></select>
    <button class="btn small" type="button" id="testMic">Testen</button>
  </div>
  <div class="meter"><div id="meterBar"></div></div>
  <div class="hint">Klick auf „Testen“, erlaube das Mikrofon und wähl dann dein Dell-Mikrofon aus der Liste. Der Balken sollte sich beim Sprechen bewegen.</div>

  <label for="voiceSelect">Stimme</label>
  <select id="voiceSelect"></select>

  <label for="modelInput">Antwort-Modell</label>
  <input type="text" id="modelInput" list="models">
  <datalist id="models">
    <option value="gpt-4o-mini">
    <option value="gpt-4.1-mini">
    <option value="gpt-4o">
  </datalist>

  <label for="sttSelect">Spracherkennung</label>
  <select id="sttSelect">
    <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe (schnell)</option>
    <option value="gpt-4o-transcribe">gpt-4o-transcribe (genauer)</option>
    <option value="whisper-1">whisper-1</option>
  </select>

  <div class="check"><input type="checkbox" id="speakCheck"> <label for="speakCheck" style="margin:0;color:inherit">Antworten vorlesen</label></div>

  <div class="actions">
    <button class="btn small" type="button" id="clearBtn">Verlauf löschen</button>
    <button class="btn small" type="button" id="saveBtn">Speichern</button>
  </div>
</dialog>

<script>
"use strict";

/* ---------- Einstellungen ---------- */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("jarvis_" + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jarvis_" + k, v); } catch {} },
};
const cfg = {
  get key() { return store.get("key", "").trim(); },
  get model() { return store.get("model", "gpt-4o-mini") || "gpt-4o-mini"; },
  get stt() { return store.get("stt", "gpt-4o-mini-transcribe"); },
  get micId() { return store.get("micId", ""); },
  get voice() { return store.get("voice", ""); },
  get speak() { return store.get("speak", "1") === "1"; },
};

const SILENCE_MS = 900;     // so lange Pause = du bist fertig
const NO_SPEECH_MS = 8000;  // nichts gesagt → abbrechen
const MAX_MS = 30000;       // maximale Aufnahmedauer
const HISTORY_LIMIT = 16;

function systemPrompt() {
  const now = new Date().toLocaleString("de-CH", { dateStyle: "full", timeStyle: "short" });
  return `Du bist J.A.R.V.I.S., ein schlauer, lockerer persönlicher KI-Assistent mit trockenem Humor.
Du antwortest immer auf Deutsch, außer man spricht dich in einer anderen Sprache an.
Deine Antworten werden laut vorgelesen. Darum: kurz und direkt, meistens 1 bis 3 Sätze.
Kein Markdown, keine Sternchen, keine Aufzählungszeichen, keine Emojis. Zahlen und Einheiten so schreiben, wie man sie spricht.
Nur wenn jemand ausdrücklich eine ausführliche Erklärung will, antwortest du länger.
Wenn du etwas nicht weißt, sag es ehrlich. Jetzt ist ${now}.`;
}

/* ---------- Zustand & Anzeige ---------- */
let state = "idle";
let callMode = false;
let busy = false;
let history = [];
let inflight = null;   // AbortController der laufenden Anfrage
let rec = null;        // laufende Aufnahme
let micStream = null;
let audioCtx = null;

const LABELS = { idle: "Bereit", listening: "Ich höre zu …", thinking: "Denke nach …", speaking: "Spreche …" };

function setState(s) {
  state = s;
  document.body.dataset.state = s;
  const st = $("#status");
  st.classList.remove("err");
  st.textContent = LABELS[s] || "";
  $("#conn").textContent = callMode ? "IM GESPRÄCH" : "BEREIT";
  if (s !== "listening") setLevel(0);
}

function showError(e) {
  if (e && e.name === "AbortError") return;
  console.error(e);
  const st = $("#status");
  st.textContent = (e && e.message) || String(e);
  st.classList.add("err");
}

function setLevel(rms) {
  document.documentElement.style.setProperty("--lvl", Math.min(1, rms * 12).toFixed(2));
}

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  const chat = $("#chat");
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function requireKey() {
  if (cfg.key) return true;
  showError(new Error("Trag zuerst deinen OpenAI API-Key unter ⚙ ein."));
  openSettings();
  return false;
}

/* ---------- Fehler von OpenAI verständlich machen ---------- */
async function apiError(res) {
  let msg = "";
  try { const j = await res.json(); msg = (j.error && j.error.message) || ""; } catch {}
  let text;
  if (res.status === 401) text = "Dein API-Key ist ungültig. Trag unter ⚙ einen neuen ein.";
  else if (res.status === 429 && /quota|billing|credit/i.test(msg)) text = "Dein OpenAI-Konto hat kein Guthaben. Lade auf platform.openai.com unter Billing Guthaben auf.";
  else if (res.status === 429) text = "Zu viele Anfragen. Warte kurz und versuch es nochmal.";
  else text = `OpenAI-Fehler ${res.status}: ${msg}`;
  const err = new Error(text);
  err.status = res.status;
  return err;
}

/* ---------- Mikrofon ---------- */
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

async function getStream(deviceId = cfg.micId) {
  if (micStream && micStream.active) return micStream;
  const base = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Dieser Browser erlaubt keinen Mikrofonzugriff. Öffne die Seite über https.");
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: deviceId ? { ...base, deviceId: { exact: deviceId } } : base,
    });
  } catch (e) {
    if (e.name === "OverconstrainedError" || e.name === "NotFoundError") {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: base });
    } else if (e.name === "NotAllowedError") {
      throw new Error("Mikrofon ist blockiert. Klick links in der Adressleiste auf das Mikrofon- oder Schloss-Symbol und erlaube den Zugriff.");
    } else {
      throw e;
    }
  }
  return micStream;
}

function releaseStream() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
}

function pickMime() {
  const types = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4"];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}

// Nimmt auf, bis du eine kurze Pause machst. Gibt null zurück, wenn nichts gesagt wurde.
async function record() {
  unlockAudio();
  const stream = await getStream();
  const mime = pickMime();
  const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

  const src = audioCtx.createMediaStreamSource(stream);
  const an = audioCtx.createAnalyser();
  an.fftSize = 1024;
  src.connect(an);
  const buf = new Float32Array(an.fftSize);

  return new Promise((resolve) => {
    const start = performance.now();
    let last = start, heard = false, floor = 1, timer = null;

    const finish = () => { if (recorder.state !== "inactive") recorder.stop(); };
    recorder.onstop = () => {
      clearInterval(timer);
      try { src.disconnect(); } catch {}
      rec = null;
      setLevel(0);
      const type = recorder.mimeType || mime || "audio/webm";
      resolve(heard && chunks.length ? { blob: new Blob(chunks, { type }), type } : null);
    };
    rec = { stop: finish };
    recorder.start(250);
    setState("listening");

    timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();
      if (now - start < 350) floor = Math.min(floor, rms);
      const threshold = Math.max(0.012, floor * 3);
      setLevel(rms);
      if (rms > threshold && now - start > 150) { heard = true; last = now; }
      if (heard && now - last > SILENCE_MS) return finish();
      if (!heard && now - start > NO_SPEECH_MS) return finish();
      if (now - start > MAX_MS) return finish();
    }, 50);
  });
}

/* ---------- Spracherkennung (OpenAI) ---------- */
const HALLUCINATIONS = /untertitel|amara\.org|vielen dank fürs zuschauen|bis zum nächsten mal|copyright|swr \d/i;

async function transcribe(audio, model = cfg.stt) {
  const ext = audio.type.includes("ogg") ? "ogg" : audio.type.includes("mp4") ? "mp4" : "webm";
  const form = new FormData();
  form.append("file", audio.blob, "sprache." + ext);
  form.append("model", model);
  form.append("language", "de");

  inflight = new AbortController();
  const res = await fetch("https://api.openai.com/v1/audio/transcriptions", {
    method: "POST",
    headers: { Authorization: "Bearer " + cfg.key },
    body: form,
    signal: inflight.signal,
  });
  if (!res.ok) {
    const err = await apiError(res);
    if ((err.status === 400 || err.status === 404) && model !== "whisper-1") return transcribe(audio, "whisper-1");
    throw err;
  }
  const { text } = await res.json();
  const t = (text || "").trim();
  if (!t || t.length < 2 || HALLUCINATIONS.test(t)) return "";
  return t;
}

/* ---------- Sprachausgabe ---------- */
let voices = [];
function loadVoices() {
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter((v) => /^de/i.test(v.lang));
  const sel = $("#voiceSelect");
  sel.innerHTML = "";
  const auto = document.createElement("option");
  auto.value = ""; auto.textContent = "Automatisch (beste deutsche Stimme)";
  sel.appendChild(auto);
  voices.forEach((v) => {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  sel.value = cfg.voice;
}
function pickVoice() {
  if (!voices.length) return null;
  return voices.find((v) => v.name === cfg.voice)
    || voices.find((v) => /conrad|killian|florian/i.test(v.name) && /natural|online/i.test(v.name))
    || voices.find((v) => /natural|online/i.test(v.name))
    || voices.find((v) => /google/i.test(v.name))
    || voices[0];
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

const speaker = {
  pending: 0,
  waiters: [],
  say(text) {
    if (!cfg.speak || !window.speechSynthesis) return;
    const t = text.replace(/https?:\/\/\S+/g, "").replace(/[*#_`>|]/g, "").trim();
    if (!t) return;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "de-DE";
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = 1.08;
    this.pending++;
    let finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      this.pending = Math.max(0, this.pending - 1);
      if (this.pending === 0) this.waiters.splice(0).forEach((r) => r());
    };
    u.onend = done;
    u.onerror = done;
    setTimeout(done, 4000 + t.length * 120); // Sicherheitsnetz, falls der Browser hängt
    setState("speaking");
    speechSynthesis.speak(u);
  },
  done() { return this.pending === 0 ? Promise.resolve() : new Promise((r) => this.waiters.push(r)); },
  stop() {
    if (window.speechSynthesis) speechSynthesis.cancel();
    this.pending = 0;
    this.waiters.splice(0).forEach((r) => r());
  },
};

/* ---------- Antwort holen (gestreamt, Satz für Satz vorlesen) ---------- */
async function ask(text) {
  speaker.stop();
  addMsg("user", text);
  history.push({ role: "user", content: text });
  history = history.slice(-HISTORY_LIMIT);

  const el = addMsg("jarvis", "");
  setState("thinking");
  inflight = new AbortController();

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      stream: true,
      messages: [{ role: "system", content: systemPrompt() }, ...history],
    }),
    signal: inflight.signal,
  });
  if (!res.ok) { el.remove(); history.pop(); throw await apiError(res); }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buffer = "", full = "", sentence = "";
  const chat = $("#chat");

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const data = l.slice(5).trim();
      if (data === "[DONE]") continue;
      let delta = "";
      try { delta = JSON.parse(data).choices?.[0]?.delta?.content || ""; } catch { continue; }
      if (!delta) continue;
      full += delta;
      sentence += delta;
      el.textContent = full;
      chat.scrollTop = chat.scrollHeight;
      // fertige Sätze sofort vorlesen, nicht auf die ganze Antwort warten
      let m;
      while ((m = sentence.match(/^[\s\S]*?[.!?…]+["»”]?\s/))) {
        speaker.say(m[0]);
        sentence = sentence.slice(m[0].length);
      }
    }
  }
  if (sentence.trim()) speaker.say(sentence);
  history.push({ role: "assistant", content: full });
  await speaker.done();
}

/* ---------- Bedienung ---------- */
async function talkOnce() {
  if (busy || callMode) return;
  if (!requireKey()) return;
  busy = true;
  try {
    const audio = await record();
    if (audio) {
      setState("thinking");
      const text = await transcribe(audio);
      if (text) await ask(text);
    }
    setState("idle");
  } catch (e) {
    setState("idle");
    showError(e);
  } finally {
    busy = false;
    releaseStream();
  }
}

async function startCall() {
  if (!requireKey()) return;
  speaker.stop();
  callMode = true;
  $("#callBtn").textContent = "Auflegen";
  $("#callBtn").classList.add("live");
  while (callMode) {
    try {
      const audio = await record();
      if (!callMode) break;
      if (!audio) continue;
      setState("thinking");
      const text = await transcribe(audio);
      if (!callMode) break;
      if (text) await ask(text);
    } catch (e) {
      if (!callMode) break;
      showError(e);
      hangUp(false);
      return;
    }
  }
}

function hangUp(resetStatus = true) {
  callMode = false;
  if (rec) rec.stop();
  if (inflight) inflight.abort();
  speaker.stop();
  releaseStream();
  $("#callBtn").textContent = "Gespräch starten";
  $("#callBtn").classList.remove("live");
  if (resetStatus) setState("idle");
  else $("#conn").textContent = "BEREIT";
}

$("#callBtn").addEventListener("click", () => {
  unlockAudio();
  callMode ? hangUp() : startCall();
});

$("#micBtn").addEventListener("click", () => {
  unlockAudio();
  if (state === "speaking") { speaker.stop(); return; }   // Jarvis unterbrechen
  if (state === "listening" && rec) { rec.stop(); return; } // fertig gesprochen
  talkOnce();
});

$("#textForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("#textInput");
  const text = input.value.trim();
  if (!text || !requireKey()) return;
  input.value = "";
  if (callMode) hangUp();
  busy = true;
  try { await ask(text); setState("idle"); }
  catch (err) { setState("idle"); showError(err); }
  finally { busy = false; }
});

// Leertaste = einmal sprechen (wenn du nicht gerade tippst)
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || $("#settings").open) return;
  e.preventDefault();
  $("#micBtn").click();
});

/* ---------- Einstellungsfenster ---------- */
let meterTimer = null;

async function listMics() {
  const sel = $("#micSelect");
  try {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
    sel.innerHTML = '<option value="">Standard-Mikrofon</option>';
    devices.forEach((d, i) => {
      if (!d.deviceId || d.deviceId === "default") return;
      const o = document.createElement("option");
      o.value = d.deviceId;
      o.textContent = d.label || `Mikrofon ${i + 1}`;
      sel.appendChild(o);
    });
    sel.value = cfg.micId;
    if (sel.value !== cfg.micId) sel.value = "";
  } catch {}
}

function openSettings() {
  $("#keyInput").value = cfg.key;
  $("#modelInput").value = cfg.model;
  $("#sttSelect").value = cfg.stt;
  $("#speakCheck").checked = cfg.speak;
  loadVoices();
  listMics();
  if (!$("#settings").open) $("#settings").showModal();
}

function stopMeter() {
  clearInterval(meterTimer);
  meterTimer = null;
  $("#meterBar").style.width = "0";
}

$("#settingsBtn").addEventListener("click", openSettings);
$("#showKey").addEventListener("click", () => {
  const k = $("#keyInput");
  k.type = k.type === "password" ? "text" : "password";
});

$("#testMic").addEventListener("click", async () => {
  if (callMode) hangUp();
  stopMeter();
  releaseStream();
  unlockAudio();
  try {
    const stream = await getStream($("#micSelect").value);
    await listMics();
    const src = audioCtx.createMediaStreamSource(stream);
    const an = audioCtx.createAnalyser();
    an.fftSize = 1024;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const started = performance.now();
    meterTimer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      $("#meterBar").style.width = Math.min(100, Math.sqrt(sum / buf.length) * 1200) + "%";
      if (performance.now() - started > 8000) {
        stopMeter();
        try { src.disconnect(); } catch {}
        releaseStream();
      }
    }, 50);
  } catch (e) {
    alert(e.message || e);
  }
});

$("#micSelect").addEventListener("change", () => { stopMeter(); releaseStream(); });

$("#saveBtn").addEventListener("click", () => {
  store.set("key", $("#keyInput").value.trim());
  store.set("model", $("#modelInput").value.trim() || "gpt-4o-mini");
  store.set("stt", $("#sttSelect").value);
  store.set("micId", $("#micSelect").value);
  store.set("voice", $("#voiceSelect").value);
  store.set("speak", $("#speakCheck").checked ? "1" : "0");
  stopMeter();
  releaseStream();
  $("#settings").close();
  setState(state);
  $("#status").textContent = "Gespeichert. Klick auf 🎤 oder „Gespräch starten“.";
});

$("#settings").addEventListener("close", () => { stopMeter(); });

$("#clearBtn").addEventListener("click", () => {
  history = [];
  $("#chat").innerHTML = "";
  $("#settings").close();
  setState("idle");
});

/* ---------- Start ---------- */
setState("idle");
addMsg("jarvis", "Guten Tag. Klick auf „Gespräch starten“ und sprich einfach los, oder drück die Leertaste für eine einzelne Frage.");
if (!cfg.key) openSettings();
</script>
